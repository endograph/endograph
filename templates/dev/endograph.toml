# The GRANT — owner-only, rarely touched. Only owner-granted resources live
# here: money, schedules, model access, tool grant. Operational knowledge
# (processes, ordering, readiness, tactics) is learned and lives in src/.

[budget]
daily_usd = 5.0      # soft: metered and warned about, never enforced; omit for metering only

[budget.envelopes]
opex = 0.8   # run-the-system: monitoring, diagnosis, repair
capex = 0.2  # asset-building: drafting rules, back-testing, prototyping

[tools]
grant = "full-exec"  # plain bash — the agent can do what you can

[model]
provider = "anthropic"   # or "openai"; credentials from the environment or the agent's env file
model = "claude-opus-5"
# price = { input = 5, output = 25 }   # USD per million tokens, for models the meter doesn't know

[schedule]
capex_every = 5   # a research session (compact, distill rules) after every N opex activations; 0 = only on `endo capex`
